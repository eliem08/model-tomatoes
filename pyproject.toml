[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-tomatoes"
version = "0.1.0"
description = "Rotten Tomatoes for AI models: real reviews instead of benchmarks"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
model-tomatoes = "model_tomatoes.__main__:main"

[tool.setuptools]
packages = ["model_tomatoes"]
